<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Eread · 设置</title>
<link rel="stylesheet" href="./ui.css"/>
</head>
<body>
<div class="app">
  <div class="topbar"><h1>设置</h1></div>
  <div class="content scroll fade-in">
    <button id="back-btn" title="返回" aria-label="返回">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="settings">
      <section>
        <label>主题</label>
        <div class="theme-buttons" id="theme-buttons">
          <button data-theme="light">浅色</button>
          <button data-theme="dark">深色</button>
          <button data-theme="sepia">护眼</button>
        </div>
      </section>
      <section>
        <label>阅读壁纸</label>
        <div class="field-row">
          <button id="wallpaper-btn" class="btn">导入壁纸图片</button>
          <button id="wallpaper-clear" class="btn">清除</button>
        </div>
        <div class="field">
          <span>模糊度</span>
          <div class="range-row">
            <input id="wallpaper-blur" type="range" min="0" max="20" step="1"/>
            <output id="wallpaper-blur-val"></output>
          </div>
        </div>
        <div class="field">
          <span>遮罩透明度</span>
          <div class="range-row">
            <input id="wallpaper-opacity" type="range" min="0" max="0.8" step="0.05"/>
            <output id="wallpaper-opacity-val"></output>
          </div>
        </div>
      </section>
      <section>
        <label>页面背景（书架/用户页）</label>
        <div class="swatches" id="shelf-bg-swatches"></div>
        <div class="field-row" style="margin-top:.7em;">
          <button id="shelf-wallpaper-btn" class="btn">导入页面壁纸</button>
          <button id="shelf-wallpaper-clear" class="btn">清除</button>
        </div>
      </section>
      <section>
        <label>背景颜色</label>
        <div class="swatches" id="bg-swatches"></div>
      </section>
      <section>
        <label>文字颜色</label>
        <div class="swatches" id="fg-swatches"></div>
      </section>
      <section>
        <label for="font-size">文字大小</label>
        <div class="range-row">
          <input id="font-size" type="range" min="14" max="28" step="1"/>
          <output id="font-size-val"></output>
        </div>
      </section>
      <section>
        <label>注释文字颜色</label>
        <div class="swatches" id="rt-swatches"></div>
      </section>
      <section>
        <label for="rt-scale">注释文字大小（正文倍数，&lt;1）</label>
        <div class="range-row">
          <input id="rt-scale" type="range" min="0.40" max="0.80" step="0.05"/>
          <output id="rt-scale-val"></output>
        </div>
      </section>
      <section>
        <label>浏览模式</label>
        <div class="mode-buttons" id="flow-buttons">
          <button data-flow="paginated">横向翻页</button>
          <button data-flow="scrolled">纵向连贯</button>
        </div>
      </section>
      <section id="scroll-mode-section" hidden>
        <label>滑动方式（纵向连贯）</label>
        <div class="mode-buttons" id="scroll-mode-buttons">
          <button data-mode="native">原生滑动</button>
          <button data-mode="variable">差速滑动</button>
        </div>
      </section>
      <section id="scroll-factor-section" hidden>
        <label for="scroll-factor">滑动系数（差速）</label>
        <div class="range-row">
          <input id="scroll-factor" type="range" min="0.5" max="1" step="0.05"/>
          <output id="scroll-factor-val"></output>
        </div>
      </section>
      <section id="scroll-direction-section" hidden>
        <label>滑动方向（手下滑时）</label>
        <div class="mode-buttons" id="scroll-direction-buttons">
          <button data-dir="reverse">看下文</button>
          <button data-dir="natural">看上文</button>
        </div>
      </section>
      <section>
        <label for="search-site">单词搜索跳转网站</label>
        <select id="search-site">
          <option value="google">Google 翻译</option>
          <option value="youdao">有道词典</option>
          <option value="eudic">欧路词典</option>
        </select>
      </section>
      <section>
        <label>查词弹窗位置</label>
        <div class="mode-buttons" id="popup-position-buttons">
          <button data-pos="bottom-left">页面左下角</button>
          <button data-pos="around-word">单词周围</button>
        </div>
      </section>
      <section>
        <label>查词方式</label>
        <div class="mode-buttons" id="lookup-mode-buttons">
          <button data-mode="online-first">联网优先</button>
          <button data-mode="local-first">本地优先</button>
        </div>
      </section>
      <section>
        <label>翻译练习</label>
        <div class="field">
          <span>难度（决定原文词汇层次与用词评分）</span>
          <div class="mode-buttons" id="practice-difficulty-buttons">
            <button data-d="zhongkao">中考</button>
            <button data-d="gaokao">高考</button>
            <button data-d="cet4">四级</button>
            <button data-d="cet6">六级</button>
            <button data-d="ielts">雅思</button>
            <button data-d="toefl">托福</button>
          </div>
        </div>
        <div class="field">
          <span>英译中：英文词数目标</span>
          <input id="practice-en-len" type="number" min="8" max="60" step="1"/>
        </div>
        <div class="field">
          <span>中译英：中文字数目标</span>
          <input id="practice-cn-len" type="number" min="8" max="80" step="1"/>
        </div>
        <div class="field">
          <span>题材偏好（空 = 无限定）</span>
          <div class="field-row">
            <input id="practice-topic" type="text" placeholder="例如：科技、历史、校园生活…"/>
            <button id="practice-topic-confirm" class="btn">确认</button>
          </div>
        </div>
        <div class="field">
          <span>题目点词翻译</span>
          <div class="mode-buttons" id="practice-tap-lookup-buttons">
            <button data-v="1">开启</button>
            <button data-v="0">关闭</button>
          </div>
        </div>
        <div class="field">
          <span>随机参数（越高句子越多样）</span>
          <div class="range-row">
            <input id="practice-temperature" type="range" min="0" max="1.5" step="0.1"/>
            <output id="practice-temperature-val"></output>
          </div>
        </div>
      </section>
      <section>
        <label>翻译 API 配置</label>
        <div class="field">
          <span>Base URL</span>
          <input id="api-base-url" type="text" placeholder="https://api.deepseek.com"/>
        </div>
        <div class="field">
          <span>模型</span>
          <input id="api-model" type="text" placeholder="deepseek-chat"/>
        </div>
        <div class="field">
          <span>API Key</span>
          <input id="api-key" type="password" placeholder="输入 API Key"/>
        </div>
        <div class="field">
          <button id="api-save" class="btn-solid">保存配置</button>
        </div>
      </section>
    </div>
  </div>
</div>
<script type="module" src="./settings-page.js"></script>
</body>
</html>
