<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Eread · 设置</title>
<link rel="stylesheet" href="./ui.css"/>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font: 14px/1.5 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--app-fg, #222); }
  .app { display: flex; flex-direction: column; height: 100vh; background: var(--app-bg, #fafafa); }

  .topbar { height: 10vh; min-height: 48px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .topbar h1 { font-size: 17px; font-weight: 600; margin: 0; }

  .content { flex: 1; position: relative; overflow-y: auto; }

  /* 浮动返回键 */
  #back-btn { position: fixed; top: calc(10vh + 8px); left: 8px; z-index: 20; width: 38px; height: 38px; font-size: 20px; line-height: 1; border: none; background: rgba(0,0,0,.35); color: #fff; border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }

  /* 设置区块 */
  .settings { padding: 1em; max-width: 560px; margin: 0 auto; padding-top: 3.2em; }
  section { background: #fff; border: 1px solid #eee; border-radius: 8px; padding: .8em 1em; margin-bottom: .8em; }
  section > label { display: block; font-weight: 600; margin-bottom: .5em; font-size: 13px; color: #333; }
  .swatches { display: flex; gap: .5em; flex-wrap: wrap; }
  .swatch { width: 32px; height: 32px; border-radius: 6px; border: 1px solid #ccc; cursor: pointer; box-sizing: border-box; }
  .swatch.active { outline: 2px solid #2563eb; outline-offset: 1px; }
  .range-row { display: flex; align-items: center; gap: .5em; }
  .range-row input { flex: 1; }
  .range-row output { min-width: 3.5em; color: #666; font-size: 13px; }
  .mode-buttons { display: flex; gap: .5em; }
  .mode-buttons button { flex: 1; padding: .5em; border: 1px solid #ddd; background: #fff; border-radius: 5px; cursor: pointer; }
  .mode-buttons button.active { background: #111; color: #fff; border-color: #111; }
  .theme-buttons { display: flex; gap: .5em; }
  .theme-buttons button { flex: 1; padding: .5em; border: 1px solid #ddd; background: #fff; border-radius: 5px; cursor: pointer; }
  .theme-buttons button.active { background: var(--accent-grad, linear-gradient(135deg,#2563eb,#7c3aed)); color: #fff; border-color: transparent; }
  select { width: 100%; padding: .5em; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; }
  .field { margin-bottom: .6em; }
  .field span { display: block; font-size: 12px; color: #666; margin-bottom: .25em; }
  .field input { width: 100%; padding: .5em; border: 1px solid #ddd; border-radius: 5px; font-size: 14px; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar glass-bar"><h1>设置</h1></div>
  <div class="content fade-in">
    <button id="back-btn" title="返回">←</button>
    <div class="settings">
      <section>
        <label>主题</label>
        <div class="theme-buttons" id="theme-buttons">
          <button data-theme="light">浅色</button>
          <button data-theme="dark">深色</button>
          <button data-theme="sepia">护眼</button>
        </div>
      </section>
      <section>
        <label>阅读壁纸</label>
        <div class="field" style="display:flex; gap:.5em;">
          <button id="wallpaper-btn" style="flex:1; padding:.5em; border:1px solid #ddd; background:#fff; border-radius:5px; cursor:pointer;">导入壁纸图片</button>
          <button id="wallpaper-clear" style="padding:.5em .8em; border:1px solid #ddd; background:#fff; border-radius:5px; cursor:pointer;">清除</button>
        </div>
        <div class="field" style="margin-top:.6em;">
          <span>模糊度</span>
          <div class="range-row">
            <input id="wallpaper-blur" type="range" min="0" max="20" step="1"/>
            <output id="wallpaper-blur-val"></output>
          </div>
        </div>
        <div class="field">
          <span>遮罩透明度</span>
          <div class="range-row">
            <input id="wallpaper-opacity" type="range" min="0" max="0.8" step="0.05"/>
            <output id="wallpaper-opacity-val"></output>
          </div>
        </div>
      </section>
      <section>
        <label>页面背景（书架/用户页）</label>
        <div class="swatches" id="shelf-bg-swatches"></div>
        <div class="field" style="margin-top:.6em; display:flex; gap:.5em;">
          <button id="shelf-wallpaper-btn" style="flex:1; padding:.5em; border:1px solid #ddd; background:#fff; border-radius:5px; cursor:pointer;">导入页面壁纸</button>
          <button id="shelf-wallpaper-clear" style="padding:.5em .8em; border:1px solid #ddd; background:#fff; border-radius:5px; cursor:pointer;">清除</button>
        </div>
      </section>
      <section>
        <label>背景颜色</label>
        <div class="swatches" id="bg-swatches"></div>
      </section>
      <section>
        <label>文字颜色</label>
        <div class="swatches" id="fg-swatches"></div>
      </section>
      <section>
        <label>文字大小</label>
        <div class="range-row">
          <input id="font-size" type="range" min="14" max="28" step="1"/>
          <output id="font-size-val"></output>
        </div>
      </section>
      <section>
        <label>注释文字颜色</label>
        <div class="swatches" id="rt-swatches"></div>
      </section>
      <section>
        <label>注释文字大小（正文倍数，&lt;1）</label>
        <div class="range-row">
          <input id="rt-scale" type="range" min="0.40" max="0.80" step="0.05"/>
          <output id="rt-scale-val"></output>
        </div>
      </section>
      <section>
        <label>浏览模式</label>
        <div class="mode-buttons" id="flow-buttons">
          <button data-flow="paginated">横向翻页</button>
          <button data-flow="scrolled">纵向连贯</button>
        </div>
      </section>
      <section>
        <label>单词搜索跳转网站</label>
        <select id="search-site">
          <option value="google">Google 翻译</option>
          <option value="youdao">有道词典</option>
          <option value="eudic">欧路词典</option>
        </select>
      </section>
      <section>
        <label>查词弹窗位置</label>
        <div class="mode-buttons" id="popup-position-buttons">
          <button data-pos="bottom-left">页面左下角</button>
          <button data-pos="around-word">单词周围</button>
        </div>
      </section>
      <section>
        <label>翻译 API 配置</label>
        <div class="field">
          <span>Base URL</span>
          <input id="api-base-url" type="text" placeholder="https://api.deepseek.com"/>
        </div>
        <div class="field">
          <span>模型</span>
          <input id="api-model" type="text" placeholder="deepseek-chat"/>
        </div>
        <div class="field">
          <span>API Key</span>
          <input id="api-key" type="password" placeholder="输入 API Key"/>
        </div>
        <div class="field" style="margin-top:.6em;">
          <button id="api-save" style="width:100%; padding:.5em; border:none; background:linear-gradient(135deg,#2563eb,#7c3aed); color:#fff; border-radius:5px; cursor:pointer; font-size:14px;">保存配置</button>
        </div>
      </section>
    </div>
  </div>
</div>
<script type="module" src="./settings-page.js"></script>
</body>
</html>
