<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Eread · 收藏</title>
<link rel="stylesheet" href="./ui.css"/>
</head>
<body>
<div class="app">
  <div class="topbar"><h1>收藏</h1></div>
  <div class="content scroll fade-in">
    <button id="back-btn" title="返回" aria-label="返回">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <div class="favorites">
      <div class="mode-buttons" id="filter-buttons">
        <button data-filter="all" class="active">全部</button>
        <button data-filter="zh2en">中译英</button>
        <button data-filter="en2zh">英译中</button>
        <button data-filter="none">无</button>
      </div>
      <div class="fav-toolbar" id="fav-toolbar" hidden>
        <label class="fav-select-all"><input type="checkbox" id="select-all"/> 全选</label>
        <button id="delete-selected" class="btn">删除所选</button>
      </div>
      <div id="list"></div>
    </div>
  </div>
  <div class="bottombar">
    <button class="tab" data-page="shelf" aria-label="书架">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      <span>书架</span>
    </button>
    <button class="tab active" data-page="practice" aria-label="练习">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 8l6 6m-7 0l6-6l2-3M2 5h12M7 2h1m14 20l-5-10l-5 10m2-4h6"/></svg>
      <span>练习</span>
    </button>
    <button class="tab" data-page="user" aria-label="用户">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      <span>用户</span>
    </button>
  </div>
</div>
<script type="module" src="./favorites.js"></script>
</body>
</html>
