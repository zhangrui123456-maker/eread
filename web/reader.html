<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Eread</title>
<link rel="stylesheet" href="./ui.css"/>

<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline' blob:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' blob: data:; frame-src 'self' blob:; child-src 'self' blob:; worker-src 'self' blob:;"/>
</head>
<body>
<div class="app">
  <div class="topbar"><h1 id="book-title">—</h1></div>
  <div class="content">
    <div id="wallpaper-bg"></div>
    <foliate-view id="view"></foliate-view>
    <button id="back-btn" title="返回书架" aria-label="返回书架">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
  </div>
  <div class="bottombar">
    <button id="prev" class="icon-btn" title="上一页" aria-label="上一页">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M15 18l-6-6 6-6"/></svg>
    </button>
    <button id="next" class="icon-btn" title="下一页" aria-label="下一页">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M9 18l6-6-6-6"/></svg>
    </button>
    <span id="location">—</span>
    <button id="menu-btn" class="icon-btn" title="功能菜单" aria-label="功能菜单" aria-haspopup="dialog" aria-controls="menu">
      <svg viewBox="0 0 24 24" width="22" height="22" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M4 7h16M4 12h16M4 17h16"/></svg>
    </button>
  </div>
</div>

<div id="menu-mask"></div>
<div id="menu" role="dialog" aria-modal="true" aria-label="功能菜单">
  <div class="menu-header">
    <strong>功能菜单</strong>
    <button id="menu-close" class="icon-btn" title="关闭" aria-label="关闭">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M6 6l12 12M18 6L6 18"/></svg>
    </button>
  </div>
  <div class="menu-body">
    <div class="menu-section">
      <label for="jump-index">跳页（章节序号，从 0 起）</label>
      <div id="jump-row">
        <input id="jump-index" type="number" min="0" placeholder="输入章节号"/>
        <button id="jump-go">跳转</button>
      </div>
    </div>
    <div class="menu-section">
      <label>背景颜色</label>
      <div class="swatches" id="bg-swatches"></div>
    </div>
    <div class="menu-section">
      <label>文字颜色</label>
      <div class="swatches" id="fg-swatches"></div>
    </div>
    <div class="menu-section">
      <label for="font-size">文字大小</label>
      <div class="range-row">
        <input id="font-size" type="range" min="14" max="28" step="1"/>
        <output id="font-size-val"></output>
      </div>
    </div>
    <div class="menu-section">
      <label>注释文字颜色</label>
      <div class="swatches" id="rt-swatches"></div>
    </div>
    <div class="menu-section">
      <label for="rt-scale">注释文字大小（正文倍数，&lt;1）</label>
      <div class="range-row">
        <input id="rt-scale" type="range" min="0.40" max="0.80" step="0.05"/>
        <output id="rt-scale-val"></output>
      </div>
    </div>
    <div class="menu-section">
      <label>浏览模式</label>
      <div class="mode-buttons" id="flow-buttons">
        <button data-flow="paginated">横向翻页</button>
        <button data-flow="scrolled">纵向连贯</button>
      </div>
    </div>
    <div class="menu-section" id="scroll-mode-section" hidden>
      <label>滑动方式（纵向连贯）</label>
      <div class="mode-buttons" id="scroll-mode-buttons">
        <button data-mode="native">原生滑动</button>
        <button data-mode="variable">差速滑动</button>
      </div>
    </div>
    <div class="menu-section" id="scroll-factor-section" hidden>
      <label for="scroll-factor">滑动系数（差速）</label>
      <div class="range-row">
        <input id="scroll-factor" type="range" min="0.5" max="1" step="0.05"/>
        <output id="scroll-factor-val"></output>
      </div>
    </div>
    <div class="menu-section" id="scroll-direction-section" hidden>
      <label>滑动方向（手下滑时）</label>
      <div class="mode-buttons" id="scroll-direction-buttons">
        <button data-dir="reverse">看下文</button>
        <button data-dir="natural">看上文</button>
      </div>
    </div>
  </div>
</div>

<div id="loading" class="loading-mask">
  <div class="loading-spinner"></div>
  <div class="loading-text" id="loading-text">正在预处理电子书…</div>
</div>

<script src="./node_modules/jszip/dist/jszip.min.js"></script>
<script type="module" src="./reader/app.js"></script>
</body>
</html>
