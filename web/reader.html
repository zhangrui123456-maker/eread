<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Eread</title>
<link rel="stylesheet" href="./ui.css"/>

<meta http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self' blob:; style-src 'self' 'unsafe-inline' blob:; img-src 'self' data: blob:; media-src 'self' blob:; connect-src 'self' blob: data:; frame-src 'self' blob:; child-src 'self' blob:; worker-src 'self' blob:;"/>

<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font: 14px/1.4 system-ui, sans-serif; }
  .app { display: flex; flex-direction: column; height: 100vh; background: #fafafa; }

  /* 顶部标题栏 10% — 书名 */
  .topbar { height: 10vh; min-height: 44px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; padding: 0 3em; transition: transform .3s cubic-bezier(.4,0,.2,1); }
  .topbar h1 { font-size: 16px; font-weight: 600; margin: 0; color: #222; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

  /* 内容区 80% — 书内容 + 浮动返回键 */
  .content { flex: 1; position: relative; overflow: hidden; }
  #wallpaper-bg { position: absolute; inset: 0; background-size: cover; background-position: center; z-index: 0; pointer-events: none; display: none; }
  foliate-view { display: block; width: 100%; height: 100%; position: relative; z-index: 1; }
  #back-btn { position: absolute; top: 8px; left: 8px; z-index: 20; width: 38px; height: 38px; border: none; background: rgba(255,255,255,.6); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); border-radius: 50%; display: flex; align-items: center; justify-content: center; cursor: pointer; }
  #back-btn img { width: 22px; height: 22px; }

  /* 底部菜单栏 10% — 翻页 + 进度 + 菜单 */
  .bottombar { height: 10vh; min-height: 44px; display: flex; align-items: center; gap: .4em; padding: 0 .6em; flex-shrink: 0; position: relative; z-index: 40; transition: transform .3s cubic-bezier(.4,0,.2,1); }
  .bottombar button { font-size: 18px; line-height: 1; padding: .18em .62em; cursor: pointer; border: 1px solid var(--app-btn-border, #ddd); background: var(--app-btn-bg, #fff); border-radius: 5px; color: var(--app-btn-fg, #333); }
  .bottombar button:active { background: #eee; }
  #location { flex: 1; text-align: center; color: #666; font-variant-numeric: tabular-nums; font-size: 13px; }

  /* 功能菜单（弹窗，从下向上滑出） */
  #menu-mask { position: fixed; inset: 0; background: rgba(0,0,0,.35); z-index: 29; opacity: 0; transition: opacity .25s ease; pointer-events: none; }
  #menu-mask.show { opacity: 1; pointer-events: auto; }
  #menu { position: fixed; left: 0; right: 0; bottom: 10vh; background: #fff; border-top: 1px solid #ddd; z-index: 30; max-height: 72vh; overflow-y: auto; padding: .7em .9em 1em; box-shadow: 0 -4px 12px rgba(0,0,0,.08); transform: translateY(105%); transition: transform .28s cubic-bezier(.4,0,.2,1); }
  #menu.open { transform: translateY(0); }
  #menu .menu-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: .6em; }
  #menu .menu-header strong { font-size: 15px; }
  #menu .menu-section { margin-bottom: .9em; }
  #menu label { display: block; font-weight: 600; margin-bottom: .35em; color: #333; font-size: 13px; }
  #menu .swatches { display: flex; gap: .45em; flex-wrap: wrap; }
  #menu .swatch { width: 30px; height: 30px; border-radius: 6px; border: 1px solid #ccc; cursor: pointer; box-sizing: border-box; }
  #menu .swatch.active { outline: 2px solid #2563eb; outline-offset: 1px; }
  #menu input[type=range] { width: 100%; }
  #menu .range-row { display: flex; align-items: center; gap: .5em; }
  #menu .range-row output { min-width: 3em; color: #666; font-size: 13px; }
  #menu .mode-buttons { display: flex; gap: .45em; }
  #menu .mode-buttons button { flex: 1; padding: .45em .3em; border: 1px solid #ddd; background: #fff; border-radius: 5px; cursor: pointer; font-size: 13px; }
  #menu .mode-buttons button.active { background: #111; color: #fff; border-color: #111; }
  #jump-row { display: flex; gap: .4em; align-items: center; }
  #jump-row input { flex: 1; padding: .4em; border: 1px solid #ddd; border-radius: 5px; }
  #jump-row button { padding: .4em .8em; border: 1px solid #ddd; background: #f5f5f5; border-radius: 5px; cursor: pointer; }

  /* 预处理加载遮罩 */
  .loading-mask { position: fixed; inset: 0; z-index: 99; background: rgba(255,255,255,.85); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: flex; flex-direction: column; align-items: center; justify-content: center; gap: .8em; }
  .loading-mask[hidden] { display: none; }
  .loading-spinner { width: 36px; height: 36px; border: 3px solid #e5e7eb; border-top-color: #2563eb; border-radius: 50%; animation: eread-spin .8s linear infinite; }
  @keyframes eread-spin { to { transform: rotate(360deg); } }
  .loading-text { font-size: 14px; color: #666; }
</style>
</head>
<body>
<div class="app">
  <div class="topbar glass-bar"><h1 id="book-title">—</h1></div>
  <div class="content">
    <div id="wallpaper-bg"></div>
    <foliate-view id="view"></foliate-view>
    <button id="back-btn" title="返回书架"><img src="ico/back-dark.png" alt="返回"/></button>
  </div>
  <div class="bottombar glass-bar">
    <button id="prev" title="上一页">‹</button>
    <button id="next" title="下一页">›</button>
    <span id="location">—</span>
    <button id="menu-btn" title="功能菜单">☰</button>
  </div>
</div>

<div id="menu-mask"></div>
<div id="menu">
  <div class="menu-header">
    <strong>功能菜单</strong>
    <button id="menu-close">×</button>
  </div>
  <div class="menu-body">
    <div class="menu-section">
      <label>跳页（章节序号，从 0 起）</label>
      <div id="jump-row">
        <input id="jump-index" type="number" min="0" placeholder="输入章节号"/>
        <button id="jump-go">跳转</button>
      </div>
    </div>
    <div class="menu-section">
      <label>背景颜色</label>
      <div class="swatches" id="bg-swatches"></div>
    </div>
    <div class="menu-section">
      <label>文字颜色</label>
      <div class="swatches" id="fg-swatches"></div>
    </div>
    <div class="menu-section">
      <label>文字大小</label>
      <div class="range-row">
        <input id="font-size" type="range" min="14" max="28" step="1"/>
        <output id="font-size-val"></output>
      </div>
    </div>
    <div class="menu-section">
      <label>注释文字颜色</label>
      <div class="swatches" id="rt-swatches"></div>
    </div>
    <div class="menu-section">
      <label>注释文字大小（正文倍数，&lt;1）</label>
      <div class="range-row">
        <input id="rt-scale" type="range" min="0.40" max="0.80" step="0.05"/>
        <output id="rt-scale-val"></output>
      </div>
    </div>
    <div class="menu-section">
      <label>浏览模式</label>
      <div class="mode-buttons" id="flow-buttons">
        <button data-flow="paginated">横向翻页</button>
        <button data-flow="scrolled">纵向连贯</button>
      </div>
    </div>
  </div>
</div>

<div id="loading" class="loading-mask">
  <div class="loading-spinner"></div>
  <div class="loading-text" id="loading-text">正在预处理电子书…</div>
</div>

<script src="./node_modules/jszip/dist/jszip.min.js"></script>
<script type="module" src="./reader/app.js"></script>
</body>
</html>
