<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Eread · 书架</title>
<link rel="stylesheet" href="./ui.css"/>
</head>
<body>
<div class="app">
  <div class="topbar"><h1>书架</h1></div>
  <div class="content scroll fade-in">
    <div id="shelf" class="shelf"></div>
    <button id="import-btn" class="fab" title="导入图书" aria-label="导入图书">
      <svg viewBox="0 0 24 24" width="26" height="26" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M12 5v14M5 12h14"/></svg>
    </button>
  </div>
  <div class="bottombar">
    <button class="tab active" data-page="shelf" aria-label="书架">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="M3 11l9-8 9 8"/><path d="M5 10v10h14V10"/></svg>
      <span>书架</span>
    </button>
    <button class="tab" data-page="practice" aria-label="练习">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><path d="m5 8l6 6m-7 0l6-6l2-3M2 5h12M7 2h1m14 20l-5-10l-5 10m2-4h6"/></svg>
      <span>练习</span>
    </button>
    <button class="tab" data-page="user" aria-label="用户">
      <svg class="tab-icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true"><circle cx="12" cy="8" r="4"/><path d="M4 21c0-4 4-6 8-6s8 2 8 6"/></svg>
      <span>用户</span>
    </button>
  </div>
</div>
<script src="./node_modules/jszip/dist/jszip.min.js"></script>
<script type="module" src="./shelf/shelf.js"></script>
</body>
</html>
