<!DOCTYPE html>
<html lang="zh">
<head>
<meta charset="utf-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"/>
<title>Eread · 书架</title>
<link rel="stylesheet" href="./ui.css"/>
<style>
  :root { color-scheme: light dark; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; font: 14px/1.5 system-ui, "PingFang SC", "Microsoft YaHei", sans-serif; color: var(--app-fg, #222); }
  .app { display: flex; flex-direction: column; height: 100vh; background: var(--app-bg, #fafafa); }

  /* 顶部标题栏 10% — 只有标题 */
  .topbar { height: 10vh; min-height: 48px; display: flex; align-items: center; justify-content: center; flex-shrink: 0; }
  .topbar h1 { font-size: 17px; font-weight: 600; margin: 0; }

  /* 内容区 80% — 含浮动功能键 */
  .content { flex: 1; position: relative; overflow-y: auto; }

  /* 底部菜单栏 10% — 分类导航 */
  .bottombar { height: 10vh; min-height: 48px; display: flex; flex-shrink: 0; }
  .bottombar .tab { flex: 1; border: none; background: none; cursor: pointer; font-size: 15px; color: #999; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 3px; }
  .bottombar .tab.active { color: #2563eb; font-weight: 600; }
  .bottombar .tab .tab-icon { width: 22px; height: 22px; opacity: 0.45; transition: opacity .2s ease, filter .2s ease; }
  .bottombar .tab.active .tab-icon { opacity: 1; filter: brightness(0) saturate(100%) invert(33%) sepia(70%) saturate(2500%) hue-rotate(210deg) brightness(95%) contrast(92%); }
  .bottombar .tab span { font-size: 11px; line-height: 1; }

  /* 书架网格 */
  .shelf { display: grid; grid-template-columns: repeat(auto-fill, minmax(100px, 1fr)); gap: 1em; padding: 1em; padding-bottom: 5em; }
  .book-card { cursor: pointer; text-align: center; }
  .book-cover { aspect-ratio: 3/4; background: linear-gradient(135deg, #2563eb, #7c3aed); color: #fff; font-size: 32px; font-weight: 700; display: flex; align-items: center; justify-content: center; border-radius: 8px; box-shadow: 0 2px 8px rgba(0,0,0,.15); }
  img.book-cover { width: 100%; aspect-ratio: 3/4; object-fit: cover; }
  .add-cover { background: #fff !important; color: #999 !important; border: 2px dashed #ccc; box-shadow: none !important; font-size: 42px; font-weight: 300; }
  .book-title { margin-top: .4em; font-size: 12px; color: #333; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

  /* 浮动功能键 */
  .fab { position: absolute; right: 16px; bottom: 16px; width: 54px; height: 54px; border-radius: 50%; border: none; background: #2563eb; color: #fff; font-size: 28px; cursor: pointer; box-shadow: 0 3px 10px rgba(0,0,0,.25); }
</style>
</head>
<body>
<div class="app">
  <div class="topbar glass-bar"><h1>书架</h1></div>
  <div class="content fade-in">
    <div id="shelf" class="shelf"></div>
    <button id="import-btn" class="fab btn-primary" title="导入图书">＋</button>
  </div>
  <div class="bottombar glass-bar">
    <button class="tab active" data-page="shelf">
      <img class="tab-icon" src="ico/home-dark.png" alt="书架"/>
      <span>书架</span>
    </button>
    <button class="tab" data-page="user">
      <img class="tab-icon" src="ico/user-dark.png" alt="用户"/>
      <span>用户</span>
    </button>
  </div>
</div>
<script src="./node_modules/jszip/dist/jszip.min.js"></script>
<script type="module" src="./shelf/shelf.js"></script>
</body>
</html>
